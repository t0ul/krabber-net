# Every push to main: test, apply Terraform, and deploy the app (PLAN.md
# section 9). Off until the repository variable DEPLOY is "on", which you set
# after the first launch from a laptop (make plan, make apply, make deploy).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY == 'on'
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          KRABBER_TEST_DYNAMO_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: go test -race -count=1 ./...
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381466680812:role/krabber-gha-deploy
          aws-region: us-east-2
      - name: Terraform apply
        working-directory: infra/prod
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color
      - name: Deploy the app
        run: make deploy
