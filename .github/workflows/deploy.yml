# Every push to main: test, then apply Terraform and deploy the app (PLAN.md
# section 9). To pause deploys, disable this workflow in GitHub's Actions tab.
# Tests run in a job without AWS access, so test-time code can't mint a token
# for the deploy role.
name: deploy

on:
  push:
    branches: [main]
    # Docs and the cost model don't change what runs.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/cost_model.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        env:
          KRABBER_TEST_DYNAMO_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: go test -race -count=1 ./...

  deploy:
    needs: test
    # The krabber environment holds ALERT_EMAIL, and the deploy role trusts
    # only this environment: limit it to main in the repository's settings.
    environment: krabber
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Lambda bundles
        run: make lambdas
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::381466680812:role/krabber-gha-deploy
          aws-region: us-east-2
      - name: Terraform apply
        working-directory: infra/prod
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color
      - name: Deploy the app
        run: make deploy DEPLOY_FLAGS=-wait=false
