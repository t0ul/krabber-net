# Every pull request: tests, lint, vulnerabilities, and a Terraform plan with
# the read-only role (PLAN.md section 9).
name: ci

on:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          KRABBER_TEST_DYNAMO_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381466680812:role/krabber-gha-plan
          aws-region: us-east-2
      - name: Plan
        working-directory: infra/prod
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform fmt -check -recursive ..
          terraform init -input=false
          terraform plan -input=false -lock=false -no-color
