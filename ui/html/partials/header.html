{{ define "header" }}
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
    <title>{{ template "title" . }} · Krabber</title>
    <link rel='icon' href='{{ asset "img/favicon.svg" }}' type='image/svg+xml'>
    <link rel="manifest" href="{{ asset "manifest.webmanifest" }}">
    <link rel="apple-touch-icon" href="{{ asset "img/apple-touch-icon.png" }}">
    <meta name="theme-color" content="#15181c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Krabber">
    <link rel="stylesheet" href="{{ asset "css/bootstrap.min.css" }}" />
    <link rel="stylesheet" href="{{ asset "css/style.css" }}" />
    <link rel="stylesheet" href="{{ asset "css/color_overrides.css" }}">
    <link rel="stylesheet" href="{{ asset "css/app.css" }}">
    {{ if .LightMode }}<link rel="stylesheet" href="{{ asset "css/light_mode.css" }}">{{ end }}
    {{ if .DyslexicMode }}<link rel="stylesheet" href="{{ asset "css/dyslexic_mode.css" }}">{{ end }}
    <script src="{{ asset "js/htmx.min.js" }}" defer></script>
    <script src="{{ asset "js/app.js" }}" defer></script>
</head>
{{ end }}
