{{define "title"}}Likes{{end}}

{{define "page"}}
{{ template "shell-top" . }}
    {{ template "heading" "Liked by" }}
    {{ range .Likes }}
        <div class="d-flex align-items-center border-bottom border-dark px-3 py-2">
            <a href="/krabs/{{ .CrabName }}" class="mr-3">{{ template "avatar" .Avatar }}</a>
            <a href="/krabs/{{ .CrabName }}" class="text-light font-weight-bold">@{{ .CrabName }}</a>
            <span class="ml-auto text-muted small">{{ template "time" .CreatedAt }}</span>
        </div>
    {{ else }}
        <div class="p-4 text-center text-muted">No likes yet.</div>
    {{ end }}
{{ template "shell-bottom" . }}
{{end}}
