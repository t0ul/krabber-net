{{define "title"}}Forgot password{{end}}

{{define "page"}}
<!DOCTYPE html>
<html lang="en">
{{template "header" .}}
    <body class="bg-dark text-light">
    {{ with .Flash }}<div class="alert alert-info m-4 flash" role="status">{{ . }}</div>{{ end }}
        <img class="logo m-4" src="/static/img/krabber_logo.svg" alt="Krabber Logo" width="43" height="43">
        <form class="w-75 m-4" action='/crab/forgot' method='POST' novalidate>
            <h1>Forgot your password?</h1>
            <p class="text-muted">Enter your account's email and we'll send you a link to choose a new one.</p>
            <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
            <div class="form-group cool-input">
                <label for="forgot-email">E-mail</label>
                <input type="email" name="email" id="forgot-email" class="form-control" autocomplete="email" required>
            </div>
            {{ if .TurnstileSiteKey }}
                <div class="cf-turnstile mb-3" data-sitekey="{{ .TurnstileSiteKey }}" data-theme="dark"></div>
                <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
            {{ end }}
            <button type="submit" class="btn btn-primary rounded-pill">Send reset link</button>
            <p class="mt-3"><a href="/crab/login">Back to log in</a></p>
        </form>
    </body>
</html>
{{end}}
