{{define "title"}}{{ .Error.Status }}{{end}}

{{define "page"}}
<!DOCTYPE html>
<html lang="en">
{{template "header" .}}
    <body class="bg-dark text-light">
        <div class="kb-error m-4">
            <a href="/"><img class="logo mb-4" src="/static/img/krabber_logo.svg" alt="Krabber home" width="43" height="43"></a>
            <p class="text-muted mb-1">{{ .Error.Status }}</p>
            <h1 class="h3">{{ .Error.Title }}</h1>
            <p class="text-muted">{{ .Error.Message }}</p>
            <a class="btn btn-primary rounded-pill mt-2" href="{{ if .IsAuthenticated }}/trench{{ else }}/{{ end }}">Back to {{ if .IsAuthenticated }}your trench{{ else }}the shore{{ end }}</a>
            <a class="ml-3" href="/sea">or drift through the sea</a>
        </div>
    </body>
</html>
{{end}}
